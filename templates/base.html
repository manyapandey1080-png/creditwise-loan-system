<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CreditWise{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="wordmark">Credit<span>Wise</span></div>
      <nav class="site-nav">
        <a href="{{ url_for('home') }}" class="{{ 'active' if active == 'apply' }}">Apply</a>
        <a href="{{ url_for('history') }}" class="{{ 'active' if active == 'history' }}">Ledger</a>
        <a href="{{ url_for('metrics_page') }}" class="{{ 'active' if active == 'metrics' }}">Statement</a>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
